version: '3.8'

services:
  # Base de datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: architect_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: architect_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d architect_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Aplicación Next.js
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: architect_web
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.local
    environment:
      # Sobrescribimos el DATABASE_URL para que apunte al contenedor de postgres
      DATABASE_URL: "postgresql://admin:password123@db:5432/architect_db?schema=public"
      NODE_ENV: production
    volumes:
      # Sincronizamos el código local (opcional para dev, pero útil)
      - ./public:/app/public

volumes:
  postgres_data:
